<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 90-day operating system for building authority in 2 hours a week.">
<title>Authority Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a broadcast-desk run sheet — left rail of sections, a working surface of day columns and ledgers. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8EE; --line:#CDD5DE;
  --ink:#14202E; --muted:#5B6878; --faint:#8A96A5;
  --accent:#1D5C63; --accent-soft:#D6E8E7; --accent-ink:#FFFFFF;
  --gold:#B7791F; --gold-soft:#F6E7C8;
  --warn:#B4441C; --warn-soft:#F7DED3;
  --ok:#2F7A46;
  --j-objections:#B4441C; --j-stories:#2F6FB0; --j-trends:#7A5AA6; --j-process:#1D5C63; --j-opinions:#14202E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#17202A; --sunk:#1E2934; --line:#2C3946;
  --ink:#E6ECF2; --muted:#9AA8B7; --faint:#6D7B8A;
  --accent:#5FB3B3; --accent-soft:#1D3537; --accent-ink:#0F151C;
  --gold:#E3A84B; --gold-soft:#3A2E17;
  --warn:#E8805C; --warn-soft:#3B2219; --ok:#6CC08A;
  --j-objections:#E8805C; --j-stories:#6FA8E0; --j-trends:#B39AD8; --j-process:#5FB3B3; --j-opinions:#E6ECF2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#17202A; --sunk:#1E2934; --line:#2C3946;
  --ink:#E6ECF2; --muted:#9AA8B7; --faint:#6D7B8A;
  --accent:#5FB3B3; --accent-soft:#1D3537; --accent-ink:#0F151C;
  --gold:#E3A84B; --gold-soft:#3A2E17;
  --warn:#E8805C; --warn-soft:#3B2219; --ok:#6CC08A;
  --j-objections:#E8805C; --j-stories:#6FA8E0; --j-trends:#B39AD8; --j-process:#5FB3B3; --j-opinions:#E6ECF2;
  color-scheme:dark}

html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:800;line-height:1.1}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:500 .7rem/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;background:var(--bg)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font:800 1.15rem/1.1 var(--display)}
.brand .runline{font:500 .72rem var(--mono);color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:var(--r);font-weight:500;color:var(--muted)}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .k{font:500 .7rem var(--mono);color:var(--faint)}
.syncstate{margin-top:auto;font:500 .72rem var(--mono);color:var(--faint)}

main{padding-block:28px 64px;padding-inline:32px;min-width:0;max-width:1180px}
.view{display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:end}
.head .sub{color:var(--muted);max-width:62ch;margin-top:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);font-weight:500;font-size:.88rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}

input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

/* run progress */
.run{display:flex;flex-direction:column;gap:10px}
.track{position:relative;height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.track .w6{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
.runlegend{display:flex;justify-content:space-between;font:500 .72rem var(--mono);color:var(--muted)}
.runlegend .q{color:var(--warn)}

/* today */
.today-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.task .t{font-weight:600}
.task .d{color:var(--muted);font-size:.88rem}
.task .min{font:500 .8rem var(--mono);color:var(--accent);white-space:nowrap}
.task.done .t{text-decoration:line-through;color:var(--faint)}
.postpreview{margin-top:8px;padding:10px 12px;border-radius:var(--r);background:var(--bg);font-size:.88rem;white-space:pre-wrap}
.setup li{display:flex;gap:10px;align-items:center;padding:6px 0}
.setup ul{list-style:none;margin:0;padding:0}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--faint);flex:none}
.dot.on{background:var(--ok);border-color:var(--ok)}

/* jobs */
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:2px;background:currentColor}
.chip.example{background:var(--gold-soft);color:var(--gold)}
.job-objections{color:var(--j-objections)} .job-stories{color:var(--j-stories)} .job-trends{color:var(--j-trends)} .job-process{color:var(--j-process)} .job-opinions{color:var(--j-opinions)}
.job-none{color:var(--warn)}

/* week board */
.weekbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.board-wrap{overflow-x:auto;padding-bottom:4px}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1080px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.off{background:transparent;border-style:dashed}
.day .dh{display:flex;justify-content:space-between;align-items:baseline}
.day .dh b{font:700 .95rem var(--display)}
.day .dh span{font:500 .72rem var(--mono);color:var(--muted)}
.block{font-size:.78rem;padding:6px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.block.review{background:var(--gold-soft);color:var(--gold)}
.pcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.pcard:hover{border-color:var(--ink)}
.pcard:focus-visible{outline:2px solid var(--accent)}
.pcard .hk{font-size:.84rem;line-height:1.35;font-weight:500;overflow-wrap:anywhere}
.pcard .st{font:500 .68rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.st-posted{color:var(--ok)!important} .st-ready{color:var(--accent)!important}
.addpost{all:unset;cursor:pointer;font-size:.8rem;color:var(--faint);padding:4px 2px}
.addpost:hover{color:var(--ink)}

.mix{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.mix span{display:block;height:100%}
.mixlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.mixlegend b{font-family:var(--mono);color:var(--ink)}

/* editor drawer */
.drawer{position:fixed;inset:0;display:flex;justify-content:flex-end;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:20}
.drawer .sheet{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--surface);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.jobpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.jobpick button{all:unset;cursor:pointer;text-align:center;font-size:.78rem;font-weight:600;padding:8px 4px;border-radius:4px;border:1px solid var(--line)}
.jobpick button[aria-pressed="true"]{border-color:currentColor;background:var(--sunk)}
.killhits{font-size:.82rem;color:var(--warn)}
.killhits mark{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:2px}
.counter{font:500 .75rem var(--mono);color:var(--muted)}

/* audit */
.scorerow{display:grid;grid-template-columns:130px minmax(0,1fr) 48px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.scorerow:first-child{border-top:0}
.scorerow .nm{font-weight:600}
.scorerow .q{font-size:.85rem;color:var(--muted)}
.scorerow input[type=range]{width:100%;accent-color:var(--accent)}
.scorerow .v{font:500 1.3rem var(--mono);text-align:right}
.scorerow.lowest .nm,.scorerow.lowest .v{color:var(--warn)}
.verdict{padding:16px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink)}
.verdict b{color:var(--warn)}
.sentence{font:700 clamp(1.15rem,2.4vw,1.5rem)/1.35 var(--display)}
.sentence .slot{color:var(--accent);border-bottom:2px solid var(--accent-soft)}
.sentence .slot.empty{color:var(--faint);border-bottom-style:dashed;border-color:var(--line)}

/* profile */
.ptable{width:100%;border-collapse:collapse}
.ptable td,.ptable th{padding:12px 10px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.ptable th{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}
.ptable td:first-child{font-weight:600;width:110px}
.ptable .bad{color:var(--faint);text-decoration:line-through;width:22%}
.ptable input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}

/* signals */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kpi .n{font:600 1.9rem/1.1 var(--mono);margin-top:6px}
.kpi.star{background:var(--gold-soft);border-color:transparent}
.kpi.star .n{color:var(--gold)}
.ledger-wrap{overflow-x:auto}
.ledger{width:100%;border-collapse:collapse;min-width:720px}
.ledger th,.ledger td{padding:8px;border-top:1px solid var(--line);text-align:left}
.ledger th{font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}
.ledger td:last-child input{min-width:200px}
.ledger td input{padding:5px 7px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ledger tr.cur td{background:var(--accent-soft)}
.ledger td.wk{font:500 .82rem var(--mono);white-space:nowrap}
.chartbox svg{width:100%;height:auto;display:block}

/* strategy */
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.phase{padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.phase.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.phase ul{margin:0;padding-left:18px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.rule{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .n{font:500 .8rem var(--mono);color:var(--accent);padding-top:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:30}
.empty{padding:20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;flex-direction:row;align-items:center;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:12px}
  .brand .runline,.syncstate{display:none}
  .nav{flex-direction:row}
  .nav .k{display:none}
  .nav button{padding:6px 10px;white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  main{padding-inline:16px;padding-block:20px 48px}
  .today-grid,.grid2,.grid3,.phases{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scorerow{grid-template-columns:minmax(0,1fr) 40px}
  .scorerow input[type=range]{grid-column:1/-1;grid-row:2}
  .jobpick{grid-template-columns:repeat(3,minmax(0,1fr))}
  .task{grid-template-columns:24px minmax(0,1fr)}
  .task .min{grid-column:2;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="shell">
  <aside class="rail">
    <div class="brand"><b>Authority OS</b><span class="runline" id="runline">—</span></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="syncstate" id="sync">Loading…</div>
  </aside>
  <main id="main"></main>
</div>
<div id="drawer"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const JOBS = {
  objections:{name:"Objections", why:"Only buyers have objections, so only buyers listen to the answer.", src:"Your last 10–20 sales calls", prompt:"What did a prospect push back on this month? What do they believe that keeps them from buying?"},
  stories:{name:"Client story", why:"Proves someone like them already got the result.", src:"Wins, losses, what you'd change", prompt:"Which client got a result recently? What was the before, the turning point, the number after?"},
  trends:{name:"Trend take", why:"Shows you're current. News hits X days before LinkedIn.", src:"X and competitors' newest videos", prompt:"What changed in your industry this week? What does it mean for your ICP specifically?"},
  process:{name:"Your process", why:"Shows how you think, which is what they're buying.", src:"Voice notes on how you'd fix it", prompt:"Walk through how you'd fix your ICP's problem, step by step, as if on a call."},
  opinions:{name:"Opinion", why:"Authorities pick a side. People quote the side they agree with.", src:"What you'd argue about at dinner", prompt:"What does your industry believe that you think is wrong?"}
};
const JOB_KEYS = Object.keys(JOBS);
const PILLARS = [
  {k:"expertise",job:"process",n:"Expertise",q:"Do you actually know this better than anyone?",fix:"Show your thinking. Lean on process posts that walk through how you solve the problem."},
  {k:"visibility",n:"Visibility",q:"Do I see you often enough to remember you?",fix:"Frequency is the fix. Hit every post day for 30 days and spend the 12 minutes engaging after each post."},
  {k:"association",job:"objections",n:"Association",q:"What problem do I connect to your name?",fix:"Lock the one-sentence position and make every post about that one problem. Lead with objections."},
  {k:"voice",job:"opinions",n:"Voice",q:"Does this sound like an actual person I'd trust?",fix:"Fill the voice file and kill list. Draft from voice notes, never from a blank page. Add opinion posts."},
  {k:"proof",job:"stories",n:"Proof",q:"Has someone like me gotten a result from you?",fix:"Run client stories with real numbers. Put your best result in the Featured section and About."}
];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const STATUSES = ["idea","drafted","ready","posted"];
const VIEWS = [
  {id:"today",n:"Today",k:"T"},
  {id:"week",n:"Week plan",k:"W"},
  {id:"batch",n:"Monday batch",k:"B"},
  {id:"audit",n:"Audit & position",k:"A"},
  {id:"profile",n:"Profile",k:"P"},
  {id:"signals",n:"Friday signals",k:"F"},
  {id:"voice",n:"Voice file",k:"V"},
  {id:"strategy",n:"90-day strategy",k:"S"}
];

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; return addDays(x,-w); };
const daysBetween = (a,b) => Math.round((parseKey(keyOf(b))-parseKey(keyOf(a)))/864e5);
const fmt = (d,o) => d.toLocaleDateString(undefined,o||{month:"short",day:"numeric"});
const TODAY = new Date(); const todayKey = keyOf(TODAY);
function nextMonday(){ const t=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()); const w=t.getDay(); return addDays(t, w===1?0:((8-w)%7||7)); }

/* ---------- state ---------- */
function blankState(){
  return {v:1,startDate:keyOf(nextMonday()),postDays:[1,2,3,4,5],postTime:"08:30",batchTime:"09:00",reviewTime:"15:00",
    scores:{expertise:null,visibility:null,association:null,voice:null,proof:null},
    pos:{icp:"",problem:"",without:"",proof:"",tag:""},
    voice:{style:"",phrases:"",kill:"leverage\nsynergy\ngame-changer\nunlock\ndelve\nin today's fast-paced world\nlet that sink in\nhere's the thing"},
    profile:{banner:{text:"",done:false},headline:{text:"",done:false},featured:{text:"",done:false},about:{text:"",done:false}},
    posts:[],notes:"",done:{},weeks:{},exported:false};
}
let S = blankState();
let view = "today";
try{ const h=(location.hash||"").slice(1); if(VIEWS.some(v=>v.id===h)) view=h; else { const r=localStorage.getItem("aos.view"); if(r&&VIEWS.some(v=>v.id===r)) view=r; } }catch(e){}
let weekOffset = 0;
function defaultWeekOffset(){ const startMon=mondayOf(parseKey(S.startDate)), cur=mondayOf(TODAY);
  if(cur<startMon) return Math.round((startMon-cur)/(7*864e5));
  return TODAY.getDay()===0?1:0; }
let db=null, docRef=null, dirty=false, writing=false, saveTimer=null, mode="local", sample=null, downloads=null;

function merge(base, inc){
  if(!inc||typeof inc!=="object") return base;
  const out = Array.isArray(base)?inc.slice():{...base};
  for(const k in inc){ const b=base?base[k]:undefined, v=inc[k];
    out[k] = (b && typeof b==="object" && !Array.isArray(b) && v && typeof v==="object" && !Array.isArray(v)) ? merge(b,v) : v; }
  return out;
}
function setSync(t){ const el=document.getElementById("sync"); if(el) el.textContent=t; }
function saveLocal(){ try{ localStorage.setItem("aos.state",JSON.stringify(S)); return true; }catch(e){ return false; } }
function save(){
  const ok=saveLocal();
  if(mode!=="db"){ setSync(ok?"Saved in this browser":"Not saved (storage blocked)"); return; }
  dirty=true; setSync("Saving…");
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
function flushNow(){ if(dirty&&mode==="db"&&docRef){ clearTimeout(saveTimer); flush(); } }
window.addEventListener("pagehide",flushNow);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushNow(); });
window.addEventListener("storage",e=>{ if(e.key!=="aos.state"||!e.newValue||mode==="db") return;
  try{ S=merge(blankState(),JSON.parse(e.newValue)); }catch(x){ return; }
  if(document.activeElement&&document.activeElement.closest("input,textarea")) return;
  if(!document.querySelector("#drawer .drawer")){ renderNav(); render(); } });
async function flush(){
  if(writing){ saveTimer=setTimeout(flush,400); return; }
  const snapshot = JSON.parse(JSON.stringify(S));
  if(mode==="db"&&docRef){
    writing=true;
    try{ await docRef.set(snapshot); dirty=false; setSync("Saved to your account"); }
    catch(e){ setSync(e&&e.code==="invalid_argument"?"Read-only view":"Save failed, will retry on next edit"); }
    writing=false;
  } else {
    try{ localStorage.setItem("aos.state",JSON.stringify(snapshot)); dirty=false; setSync("Saved in this browser"); }catch(e){ setSync("Not saved (storage blocked)"); }
  }

function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2200); }
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- derived ---------- */
function runDay(){ return daysBetween(parseKey(S.startDate),TODAY)+1; }
function weekNum(d){ return Math.floor(daysBetween(parseKey(S.startDate),d)/7)+1; }
function sentenceParts(){ const p=S.pos; return {icp:p.icp.trim(),problem:p.problem.trim(),without:p.without.trim()}; }
function sentenceText(){ const p=sentenceParts(); return `I help ${p.icp||"[1 ICP]"} fix ${p.problem||"[1 problem]"} without ${p.without||"[the thing they hate]"}.`; }
function lowestPillar(){ const sc=S.scores; const vals=PILLARS.filter(p=>sc[p.k]!=null); if(vals.length<5) return null; return vals.reduce((a,b)=>sc[b.k]<sc[a.k]?b:a); }
function killWords(){ return S.voice.kill.split("\n").map(s=>s.trim()).filter(Boolean); }
function killHits(text){ const t=(text||"").toLowerCase(); return killWords().filter(w=>t.includes(w.toLowerCase())); }
function postsOn(k){ return S.posts.filter(p=>p.date===k); }
function isPostDay(d){ return S.postDays.includes(d.getDay()); }
function setupItems(){
  const pr=S.profile;
  return [
    {t:"Score the 5 parts of authority",ok:PILLARS.every(p=>S.scores[p.k]!=null),go:"audit"},
    {t:"Write your one sentence",ok:!!(S.pos.icp&&S.pos.problem&&S.pos.without),go:"audit"},
    {t:"Rebuild your profile as a landing page",ok:["banner","headline","featured","about"].every(k=>pr[k].done),go:"profile"},
    {t:"Fill your voice file and kill list",ok:S.voice.style.trim().length>20,go:"voice"},

}

  const days=[...Array(7)].map((_,i)=>addDays(mon,i));

  m.querySelectorAll("[data-pd]").forEach(c=>c.onchange=()=>{const i=+c.dataset.pd; const s=new Set(S.postDays); c.checked?s.add(i):s.delete(i); S.postDays=[...s].sort(); save(); render();});

};
function icsDT(k,t){ return k.replace(/-/g,"")+"T"+t.replace(":","")+"00"; }
function addMin(t,mins){ const [h,mm]=t.split(":").map(Number); const x=h*60+mm+mins; return pad(Math.floor(x/60)%24)+":"+pad(x%60); }
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function buildIcs(){
  const start=parseKey(S.startDate); const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Authority OS//EN","CALSCALE:GREGORIAN"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const ev=(id,k,t,mins,title,desc,rrule)=>{L.push("BEGIN:VEVENT","UID:"+id+"@authority-os","DTSTAMP:"+stamp,"DTSTART:"+icsDT(k,t),"DTEND:"+icsDT(k,addMin(t,mins)),"SUMMARY:"+icsEsc(title),"DESCRIPTION:"+icsEsc(desc)); if(rrule)L.push("RRULE:"+rrule); L.push("END:VEVENT");};
  ev("batch-"+S.startDate,S.startDate,S.batchTime,60,"Authority: Monday batch (voice notes → week's posts)","30 min: voice notes on 3–5 objections or trends.\n30 min: turn them into the week's posts with your voice file and kill list.","FREQ=WEEKLY;BYDAY=MO;COUNT=13");
  const byday=S.postDays.map(i=>["SU","MO","TU","WE","TH","FR","SA"][i]).join(",");
  if(byday){ let first=start; while(!S.postDays.includes(first.getDay())) first=addDays(first,1);
    ev("engage-"+S.startDate,keyOf(first),addMin(S.postTime,0),12,"Authority: post + 12 min engagement","Publish. Reply to every comment in the first hour. Comment on a few ICP posts.","FREQ=WEEKLY;BYDAY="+byday+";UNTIL="+keyOf(addDays(start,90)).replace(/-/g,"")+"T000000"); }
  ev("review-"+S.startDate,keyOf(addDays(start,4)),S.reviewTime,15,"Authority: Friday signal check","Read the titles of who viewed your profile and who followed. Could they buy from you? Log it in Friday signals.","FREQ=WEEKLY;BYDAY=FR;COUNT=13");
  ev("rescore30-"+S.startDate,keyOf(addDays(start,29)),S.reviewTime,15,"Authority: re-score your audit (day 30)","Re-score the 5 parts in Audit & position. Shift the next 30 days to whatever is lowest now.");
  ev("rescore60-"+S.startDate,keyOf(addDays(start,59)),S.reviewTime,15,"Authority: re-score your audit (day 60)","Re-score the 5 parts in Audit & position. Shift the last 30 days to whatever is lowest now.");
  ev("day90-"+S.startDate,keyOf(addDays(start,89)),"16:00",30,"Authority: day 90 review","Judge the run now, not before. Booked calls are the number that counts.");
  S.posts.filter(p=>p.date>=todayKey&&p.status!=="posted"&&!p.example).forEach(p=>ev("post-"+p.id,p.date,S.postTime,5,"Post: "+(p.hook||"Untitled").slice(0,80),postText(p)));
  L.push("END:VCALENDAR"); return L.join("\r\n");
}
async function exportIcs(){
  const txt=buildIcs();
  if(downloads){ try{ await downloads.save({filename:"authority-2-hour-week.ics",data:txt}); S.exported=true; save(); toast("Calendar file saved"); return; }catch(e){ if(e&&e.code==="cancelled"||e&&e.code==="declined"){return;} } }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"})); a.download="authority-2-hour-week.ics"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); if(!window.claude){ S.exported=true; save(); toast("Calendar file downloaded"); return; } }catch(e){}
  const ta=document.getElementById("icstext"); ta.hidden=false; ta.value=txt; document.getElementById("icsnote").hidden=false; S.exported=true; save();
}

        const parts=text.trim().split(/\n\s*\n/); p.hook=parts.shift().trim(); p.body=parts.join("\n\n").trim(); p.example=false; save(); draw(); d.querySelector("#pmsg").textContent="Rewritten. Read it out loud before you post.";

  };

function sampleErr(e){ const c=e&&e.code; if(c==="not_granted"||c==="sampling_disabled"){ return "Claude isn't allowed for this page. You can still write by hand."; } if(c==="rate_limited") return "Too many requests right now. Try again in a minute."; if(c==="cancelled") return ""; if(c==="invalid_json") return "Claude's answer didn't come back in the right shape. Try again."; return "Something went wrong reaching Claude. Try again."; }

function consistency(){
  const start=parseKey(S.startDate), end=TODAY<addDays(start,89)?TODAY:addDays(start,89);
  let pd=0, mons=0, batches=0;
  for(let d=new Date(start); d<=end; d=addDays(d,1)){ if(isPostDay(d)) pd++; if(d.getDay()===1){ mons++; const k=keyOf(d); if((S.done[k]||[]).some(x=>x==="batch1"||x==="batch2")||S.posts.some(p=>p.date>=k&&p.date<keyOf(addDays(d,7))&&!p.example)) batches++; } }
  const shipped=S.posts.filter(p=>p.status==="posted"&&p.date>=S.startDate&&p.date<=keyOf(end)).length;
  return {pd,shipped,mons,batches};
}
function consistencyPanel(){
  const c=consistency(); if(c.pd===0) return "";
  const pct=Math.round(Math.min(1,c.shipped/c.pd)*100);
  const bar=(n,d)=>`<div class="track" style="height:8px"><div class="fill" style="width:${d?Math.min(100,n/d*100):0}%"></div></div>`;

  <div class="stack"><div class="row" style="justify-content:space-between"><span class="label">Monday batches done</span><span class="mono">${c.batches} / ${c.mons}</span></div>${bar(c.batches,c.mons)}<span class="small muted">The batch is what makes the rest of the week take 12 minutes a day.</span></div></div>`;
}

function chart(){
  const W=760,H=220,P={l:40,r:96,t:16,b:30}; const iw=W-P.l-P.r, ih=H-P.t-P.b;

  let cum=0; const cumCalls=calls.map(c=>cum+=c);
  const imp=[...Array(13)].map((_,i)=>Number((S.weeks[i+1]||{}).impressions)||0);
  const maxC=Math.max(4,...cumCalls), maxI=Math.max(1,...imp);
  const x=i=>P.l+i*(iw/12);
  const yC=v=>P.t+ih-(v/maxC)*ih, yI=v=>P.t+ih-(v/maxI)*ih;
  const any=calls.some(Boolean)||imp.some(Boolean);
  const last=[...Array(13).keys()].reduce((a,i)=>{const w=S.weeks[i+1]||{};return SIG.some(s=>w[s.k]!==""&&w[s.k]!=null)?i:a;},-1);
  const ticks=[0,Math.round(maxC/2),maxC];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative booked calls and weekly impressions by week">`;
  ticks.forEach(t=>{s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yC(t)}" y2="${yC(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-8}" y="${yC(t)+4}" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${t}</text>`;});
  s+=`<line x1="${x(5)}" x2="${x(5)}" y1="${P.t}" y2="${P.t+ih}" stroke="var(--warn)" stroke-dasharray="3 4" stroke-width="1"/><text x="${x(5)+6}" y="${P.t+ih-8}" font-size="11" fill="var(--warn)" font-family="IBM Plex Sans, sans-serif">week 6</text>`;
  for(let i=0;i<13;i++) s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">W${i+1}</text>`;
  if(!any){ s+=`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">Log your first Friday and the lines appear here.</text></svg>`; return s; }
  const n=Math.max(0,last);
  const pI=imp.slice(0,n+1).map((v,i)=>`${i?"L":"M"}${x(i)},${yI(v)}`).join("");
  const pC=cumCalls.slice(0,n+1).map((v,i)=>`${i?"L":"M"}${x(i)},${yC(v)}`).join("");
  s+=`<path d="${pI}" fill="none" stroke="var(--faint)" stroke-width="2"/>`;
  s+=`<path d="${pC} L${x(n)},${P.t+ih} L${x(0)},${P.t+ih}Z" fill="var(--gold)" fill-opacity=".12"/><path d="${pC}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`;
  s+=`<circle cx="${x(n)}" cy="${yC(cumCalls[n])}" r="4.5" fill="var(--gold)"/><text x="${x(n)+8}" y="${yC(cumCalls[n])-6}" font-size="12" font-weight="600" fill="var(--gold)" font-family="IBM Plex Sans, sans-serif">${cumCalls[n]} calls</text>`;
  s+=`<text x="${x(n)+8}" y="${yI(imp[n])+14}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">impressions (scaled)</text>`;
  return s+`</svg>`;
}
bind.signals=m=>{
  m.querySelector("#bk").onclick=downloadBackup;
  m.querySelector("#rs").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!d.startDate||!Array.isArray(d.posts)) throw 0; S=merge(blankState(),d); save(); weekOffset=defaultWeekOffset(); renderNav(); render(); toast("Backup restored"); }
      catch(x){ m.querySelector("#bkmsg").textContent="That file isn't an Authority OS backup."; } };
    r.readAsText(f); };
  m.querySelectorAll("[data-w]").forEach(i=>{i.oninput=()=>{const w=i.dataset.w; S.weeks[w]=S.weeks[w]||{}; S.weeks[w][i.dataset.s]=i.dataset.s==="note"?i.value:(i.value===""?"":Number(i.value)); save();}; i.onchange=()=>{ if(i.dataset.s!=="note"){ const y=window.scrollY; render(); window.scrollTo(0,y);} };});
};

  <div class="head"><div><span class="label">Used every Monday</span><h1>Voice file</h1><p class="sub">Buyers check whether you sound like an actual person they'd trust. Describe how you talk and what you never say. Every draft gets checked against the kill list.</p></div></div>
  <div class="grid2">
    <label class="panel field"><span class="label">How I talk</span><textarea id="vstyle" style="min-height:200px" placeholder="Direct, a bit dry. Short sentences. I use numbers from real deals. I say 'here's what we did' more than 'here's what you should do'. I swear on calls but not in writing.">${esc(S.voice.style)}</textarea></label>
    <label class="panel field"><span class="label">Phrases I actually use</span><textarea id="vphr" style="min-height:200px" placeholder="One per line, pulled from your sales calls and voice notes.">${esc(S.voice.phrases)}</textarea></label>
  </div>
  <label class="panel field"><span class="label">Kill list · one per line · flagged in every draft</span><textarea id="vkill" style="min-height:180px;font-family:var(--mono);font-size:.88rem">${esc(S.voice.kill)}</textarea></label>

bind.voice=m=>{
  m.querySelector("#vstyle").oninput=e=>{S.voice.style=e.target.value;save();};
  m.querySelector("#vphr").oninput=e=>{S.voice.phrases=e.target.value;save();};
  m.querySelector("#vkill").oninput=e=>{S.voice.kill=e.target.value;save();};
};

/* ---------- STRATEGY ---------- */
function vStrategy(){
  const rd=runDay(); const ph=rd<=14?0:rd<=42?1:2;
  const s=parseKey(S.startDate);
  const phases=[
    {n:"Weeks 1–2 · Foundation",d:`${fmt(s)} – ${fmt(addDays(s,13))}`,items:["Score the 5 parts. Name your lowest.","Lock the one sentence and the 'that's the ___ person' tag.","Rebuild banner, headline, Featured and About as a landing page.","Pull objections from your last 10–20 sales calls into an idea bank.","Ship every post day, even if it's rough."]},
    {n:"Weeks 3–6 · Consistency",d:`${fmt(addDays(s,14))} – ${fmt(addDays(s,41))}`,items:["Run the 2-hour week without skipping a Monday.","Lead with objections and client stories.","Likes will look flat. That's expected; judge by Friday signals.","Week 6 is where most founders quit. Don't."]},
    {n:"Weeks 7–13 · Compounding",d:`${fmt(addDays(s,42))} – ${fmt(addDays(s,89))}`,items:["Re-score at day 30 and 60; shift focus to the new lowest.","Add opinion posts: pick a side people can quote.","Turn your best-performing objection into a lead magnet for Featured.","Day 90: judge by booked calls and pipeline, not impressions."]}
  ];
  const rules=[
    ["Get known for one sentence.","Post around one problem for one ICP. Leadership on Monday, AI on Tuesday and a book on Wednesday means nobody can finish the sentence about you."],
    ["Every post does one of 5 jobs.","Objections, client stories, trend takes, your process, opinions. If a post does none, cut it."],
    ["Never write from a blank page.","Voice notes on Monday become the week. The kill list keeps it sounding like you."],
    ["Spend 12 minutes after each post.","Reply to every comment in the first hour, then comment on a few ICP posts. That's where visibility comes from."],
    ["Measure the quiet readers.","Every Friday, read the titles of who viewed and who followed. If they could buy from you, it's working."],
    ["Give curiosity somewhere to go.","A profile built like a landing page turns a click on your name into a DM, a download or a call."],
    ["Don't judge before day 90.","Trust compounds in the background. Booked calls are the number that counts."]
  ];
  const cut=["Writing every post from a blank page","Testing posting times and algorithm hacks","Chasing viral posts outside your ICP","Checking likes an hour after posting","Posting more than 7 times a week","Rewriting drafts until they sound like AI"];
  return `<div class="view">
  <div class="head"><div><span class="label">The plan</span><h1>90-day authority strategy</h1><p class="sub">${S.pos.icp&&S.pos.problem?`Become the person ${esc(S.pos.icp)} think of first for ${esc(S.pos.problem)}.`:"Become the person your ICP thinks of first for one problem. Write your sentence in Audit & position to make this plan yours."}</p></div></div>
  <div class="phases">${phases.map((p,i)=>`<div class="phase ${i===ph&&rd>=1&&rd<=90?"now":""}"><span class="label">${p.d}${i===ph&&rd>=1&&rd<=90?" · you are here":""}</span><h3>${p.n}</h3><ul>${p.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="grid2">
    <div class="panel"><h3 style="margin-bottom:6px">The rules</h3>${rules.map((r,i)=>`<div class="rule"><span class="n">${pad(i+1)}</span><div><b>${r[0]}</b><p class="small muted">${r[1]}</p></div></div>`).join("")}</div>
    <div class="stack">
      <div class="panel stack"><h3>Where the 2 hours go</h3>
        <div class="row" style="justify-content:space-between"><span>Monday voice notes</span><span class="mono">30 min</span></div>
        <div class="row" style="justify-content:space-between"><span>Monday drafting</span><span class="mono">30 min</span></div>
        <div class="row" style="justify-content:space-between"><span>Engagement, ${S.postDays.length} post days × 12</span><span class="mono">${S.postDays.length*12} min</span></div>
        <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><b>Total</b><b class="mono">${Math.floor((60+S.postDays.length*12)/60)}h ${(60+S.postDays.length*12)%60}m</b></div>
      </div>
      <div class="panel stack"><h3>What you can cut</h3>${cut.map(c=>`<span class="small muted" style="text-decoration:line-through">${c}</span>`).join("")}</div>
    </div>
  </div></div>`;
}

/* ---------- boot ---------- */
function loadLocal(){ try{ const r=localStorage.getItem("aos.state"); if(r) S=merge(blankState(),JSON.parse(r)); }catch(e){} }
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")||e.metaKey||e.ctrlKey||e.altKey||document.querySelector("#drawer .drawer")) return;
  const v=VIEWS.find(v=>v.k===e.key.toUpperCase()); if(v) go(v.id);
});
loadLocal(); weekOffset=defaultWeekOffset(); renderNav(); render(); setSync("Saved in this browser");

(async()=>{
  try{
    const c=window.claude; if(!c||!c.use) return;
    c.use("sample").then(s=>{ if(s){ sample=s; if(view==="batch") render(); } });
    c.use("downloads").then(d=>{ downloads=d; });
    const d=await c.use("db"); if(!d) return;
    db=d; docRef=db.doc("app/state"); mode="db"; setSync("Connecting…");
    let first=true;
    docRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists){ if(first){ first=false; setSync("Ready"); save(); } return; }
      if(dirty||writing) return;
      if(document.activeElement&&document.activeElement.closest("input,textarea")&&!first) return;
      S=merge(blankState(),snap.data()); first=false; saveLocal(); weekOffset=defaultWeekOffset();
      setSync("Saved to your account");
      if(!document.querySelector("#drawer .drawer")){ renderNav(); render(); }
    },()=>{ mode="local"; setSync("Saved in this browser"); });
  }catch(e){}
})();
})();
</script>
